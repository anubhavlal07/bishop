[project]
name = "bishop"
version = "0.1.0"
description = "An autonomous SOC analyst: parallel investigation, ATT&CK-mapped verdicts, human-gated response."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
]
live = [
    # Only needed for a live model run. The default install is offline.
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
bishop = "bishop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bishop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: requires a live model provider; skipped by default",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests unpack the `run` fixture tuple and legitimately ignore parts of it.
"tests/**" = ["B011", "RUF059"]
# Homoglyph handling needs the confusable characters it detects, in prose and in
# test payloads. Flagging them as typos is exactly backwards here.
"src/bishop/quarantine/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/injection/*.py" = ["RUF001", "RUF002", "RUF003"]
# LangGraph inspects node annotations as strings (these modules use
# `from __future__ import annotations`) and only matches the literal forms
# "RunnableConfig" and "Optional[RunnableConfig]". `RunnableConfig | None`
# stringifies to neither and makes it warn on every node.
"src/bishop/graph/**/*.py" = ["UP045"]

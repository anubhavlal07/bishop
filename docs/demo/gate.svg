<svg xmlns="http://www.w3.org/2000/svg" width="688" height="657" viewBox="0 0 688 657" role="img" aria-label="just demo">
<rect width="688" height="657" rx="10" fill="#0b0d10" stroke="#262b33"/>
<path d="M0 10a10 10 0 0 1 10-10h668a10 10 0 0 1 10 10v24H0z" fill="#15181d"/>
<line x1="0" y1="34" x2="688" y2="34" stroke="#262b33"/>
<circle cx="20" cy="17" r="5.5" fill="#f2555a"/>
<circle cx="37" cy="17" r="5.5" fill="#e3b341"/>
<circle cx="54" cy="17" r="5.5" fill="#3fb950"/>
<text x="344.0" y="21" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#7d8590" text-anchor="middle">just demo</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
<text x="22.0" y="58" fill="#3fb950" xml:space="preserve">$ uv run bishop demo --approve none</text>
<text x="22.0" y="96" fill="#7d8590" opacity="0.62" xml:space="preserve">── HUMAN APPROVAL REQUIRED ───────────────────────────────────────────────────</text>
<text x="22.0" y="134" fill="#c9d1d9" xml:space="preserve">  This plan proposes: collect forensics, isolate host, revoke sessions,</text>
<text x="22.0" y="153" fill="#c9d1d9" xml:space="preserve">  force password reset and open ticket. 2 of 5 are irreversible.</text>
<text x="22.0" y="191" fill="#c9d1d9" xml:space="preserve">  Contain the account and the host together. Credential theft answered by</text>
<text x="22.0" y="210" fill="#c9d1d9" xml:space="preserve">  isolating the host alone leaves the adversary holding a working token, and</text>
<text x="22.0" y="229" fill="#c9d1d9" xml:space="preserve">  answering it by resetting the password alone leaves them on the endpoint.</text>
<text x="22.0" y="267" fill="#c9d1d9" xml:space="preserve">  collect_forensics → WKSTN-077</text>
<text x="22.0" y="286" fill="#7d8590" opacity="0.62" xml:space="preserve">      Read-only collection from &quot;WKSTN-077&quot;. The host stays up and the user is</text>
<text x="22.0" y="305" fill="#7d8590" opacity="0.62" xml:space="preserve">      not interrupted.</text>
<text x="22.0" y="343" fill="#f2555a" xml:space="preserve">  isolate_host → WKSTN-077 IRREVERSIBLE</text>
<text x="22.0" y="362" fill="#7d8590" opacity="0.62" xml:space="preserve">      &quot;WKSTN-077&quot; is a workstation. Its user loses network access and will</text>
<text x="22.0" y="381" fill="#7d8590" opacity="0.62" xml:space="preserve">      notice immediately; nothing else is affected.</text>
<text x="22.0" y="419" fill="#c9d1d9" xml:space="preserve">  revoke_sessions → k.svensson</text>
<text x="22.0" y="438" fill="#7d8590" opacity="0.62" xml:space="preserve">      &quot;k.svensson&quot; is signed out everywhere and must authenticate again. Low</text>
<text x="22.0" y="457" fill="#7d8590" opacity="0.62" xml:space="preserve">      impact.</text>
<text x="22.0" y="495" fill="#f2555a" xml:space="preserve">  force_password_reset → k.svensson IRREVERSIBLE</text>
<text x="22.0" y="514" fill="#7d8590" opacity="0.62" xml:space="preserve">      &quot;k.svensson&quot; loses access. They will be locked out until a helpdesk reset.</text>
<text x="22.0" y="552" fill="#c9d1d9" xml:space="preserve">  open_ticket → INC-INJ-01-cmdline-verdict-steer</text>
<text x="22.0" y="571" fill="#7d8590" opacity="0.62" xml:space="preserve">      No direct operational impact.</text>
<text x="22.0" y="628" fill="#7d8590" opacity="0.62" xml:space="preserve">── INCIDENT INC-INJ-01-cmdline-verdict-steer ─────────────────────────────────</text>
</g></svg>
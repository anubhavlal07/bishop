# Render blueprint for Bishop.
#
# The console deploys separately to Netlify (netlify.toml) because it is a
# static Next.js build that only needs the API's URL and a key.
#
# This blueprint deploys in **production mode**, which means Bishop enforces its
# own configuration rules at startup and refuses to serve if they are not met —
# see src/bishop/config.py. Two values must be supplied by hand in the Render
# dashboard before the first deploy will come up:
#
#   BISHOP_API_KEYS      generate with `uv run bishop keygen`
#   BISHOP_CORS_ORIGINS  the console's origin, e.g. https://bishop.netlify.app
#
# They are marked `sync: false` so they are never committed to this file. A key
# in version control is not a key.
#
# Both services run on Render's free tier. Two consequences worth knowing: a
# free web service sleeps after 15 minutes of inactivity and takes ~50s to wake,
# and a free Postgres expires 30 days after creation. Move both to a paid plan
# before anyone depends on the deployment.

databases:
  - name: bishop-db
    databaseName: bishop
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: bishop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    # Readiness, not liveness: Render should stop routing to an instance that
    # cannot reach the database, without restarting one that is merely waiting.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: BISHOP_ENVIRONMENT
        value: production

      # Postgres, wired from the managed database above. Production refuses to
      # start on SQLite: an audit chain that does not survive a container
      # restart is not an audit chain.
      - key: DATABASE_URL
        fromDatabase:
          name: bishop-db
          property: connectionString

      - key: BISHOP_JSON_LOGS
        value: "true"
      - key: BISHOP_LOG_LEVEL
        value: INFO
      - key: BISHOP_RATE_LIMIT_PER_MINUTE
        value: "30"

      # A public demo: no API key, and visitors bring their own model key.
      # This is an explicit mode rather than an absent setting — with it on,
      # Bishop refuses a loose rate limit, refuses to also demand an API key,
      # and never writes an alert a visitor supplied to the shared store.
      - key: BISHOP_PUBLIC_DEMO
        value: "true"
      - key: BISHOP_CORS_ORIGINS
        value: https://bishop.anubhavlal.dev

      # The model. Unset provider means the deterministic one, which serves
      # real detector findings and a real ATT&CK mapping but no model
      # judgement. Set both of these to run live — Bishop refuses to start a
      # live provider without a key rather than silently falling back, because
      # a scorecard that quietly changed provider would be meaningless.
      # No server-side model key at all. Each visitor supplies their own in
      # the console, it stays in their browser, and it travels with the runs
      # that need it — so this deployment cannot spend anybody's money.
      - key: BISHOP_MODEL_PROVIDER
        value: mock

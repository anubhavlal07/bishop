# Netlify configuration for Bishop's analyst console.
#
# Two build-time variables, set in the Netlify UI:
#
#   NEXT_PUBLIC_BISHOP_API      https://api.bishop.anubhavlal.dev
#   NEXT_PUBLIC_BISHOP_API_KEY  a key from `bishop keygen`, set on the API too
#
# Both are NEXT_PUBLIC_, so they are baked into the client bundle. That is fine
# for the API key by design — it is a shared per-deployment credential, not a
# user identity. Without the API URL the console falls back to localhost and
# says plainly that it cannot reach the backend.
#
# `publish` is relative to `base`, so it is ".next" and not "console/.next" —
# the latter resolves to console/console/.next and fails the deploy.

[build]
  base = "console"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

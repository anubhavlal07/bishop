name: Deploy console

# The console is a static export, so this builds it and publishes the files to
# Netlify. Nothing runs server-side: every page is a client component
# that talks to Bishop's API directly, which is why `output: "export"` works
# and why the whole thing is 1.1 MB of files rather than a Node server.
#
# The API needs no workflow. Render is connected to this repo and deploys on
# every push to main.
#
# Requires exactly one repository secret:
#
#   NETLIFY_AUTH_TOKEN   Netlify -> User settings -> Applications -> Personal
#                        access tokens -> New access token
#
#   gh secret set NETLIFY_AUTH_TOKEN --repo anubhavlal07/bishop
#
# Nothing else. The site id below is an identifier rather than a credential, so
# it lives in the file. And the API URL needs no variable: a production build
# defaults to the deployed API in lib/api.ts, precisely so a missing dashboard
# setting cannot ship a console pointing at localhost.

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci

      # Typecheck before publishing. A console that builds but does not
      # typecheck will fail at runtime on a page nobody clicked during review.
      - name: Typecheck
        working-directory: console
        run: npx tsc --noEmit

      - name: Build
        working-directory: console
        run: npm run build

      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 1072ea98-c20d-4f37-be47-1d13eb9ed1d6
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set - see the header of this workflow."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy --dir console/out --site "$NETLIFY_SITE_ID" --prod --no-build --message "${{ github.sha }}"

name: Deploy console

# The console is a static export, so this builds it and uploads the files to
# Cloudflare Pages. Nothing runs server-side: every page is a client component
# that talks to Bishop's API directly, which is why `output: "export"` works
# and why the whole thing is 1.1 MB of files rather than a Node server.
#
# The API needs no workflow. Render is connected to this repo and deploys on
# every push to main.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN   scoped to Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account the Pages project lives in
#
# And one repository variable:
#   NEXT_PUBLIC_BISHOP_API   https://api.bishop.anubhavlal.dev

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci

      # Typecheck before publishing. A console that builds but does not
      # typecheck will fail at runtime on a page nobody clicked during review.
      - name: Typecheck
        working-directory: console
        run: npx tsc --noEmit

      - name: Build
        working-directory: console
        env:
          NEXT_PUBLIC_BISHOP_API: ${{ vars.NEXT_PUBLIC_BISHOP_API }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — see the header of this workflow."
            exit 1
          fi
          npx --yes wrangler@latest pages deploy console/out             --project-name bishop-console             --branch main             --commit-hash "${{ github.sha }}"

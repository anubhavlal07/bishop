name: Deploy console

# The console is a static export, so this builds it and publishes the files to
# Netlify. Nothing runs server-side: every page is a client component
# that talks to Bishop's API directly, which is why `output: "export"` works
# and why the whole thing is 1.1 MB of files rather than a Node server.
#
# The API needs no workflow. Render is connected to this repo and deploys on
# every push to main.
#
# Requires one repository secret:
#   NETLIFY_AUTH_TOKEN   Netlify -> User settings -> Applications -> new access token
#   NETLIFY_SITE_ID      1072ea98-c20d-4f37-be47-1d13eb9ed1d6
#
# And one repository variable:
#   NEXT_PUBLIC_BISHOP_API   https://api.bishop.anubhavlal.dev

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci

      # Typecheck before publishing. A console that builds but does not
      # typecheck will fail at runtime on a page nobody clicked during review.
      - name: Typecheck
        working-directory: console
        run: npx tsc --noEmit

      - name: Build
        working-directory: console
        env:
          NEXT_PUBLIC_BISHOP_API: ${{ vars.NEXT_PUBLIC_BISHOP_API }}
        run: npm run build

      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set - see the header of this workflow."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy --dir console/out --site "$NETLIFY_SITE_ID" --prod --no-build --message "${{ github.sha }}"

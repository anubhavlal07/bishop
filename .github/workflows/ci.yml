name: CI

# Everything here runs offline. No secrets, no model key, no network calls
# beyond installing dependencies — which is the point: a build that needed a
# credential to verify a security control would not be verifying much.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test
        run: uv run pytest -q --junitxml=.pytest-report.xml

      # The badge is a claim about the suite and it drifts silently. It said
      # 1050 while 1355 passed. Read from the run that just happened, so it
      # costs nothing and cannot disagree with it.
      - name: Test-count badge is current
        run: uv run python scripts/check_test_badge.py .pytest-report.xml

      # A red eval fails the build. The gate compares against the committed
      # baseline in eval/results/baseline.json and fails on a regression, not on
      # an absolute threshold — the question is whether this change made things
      # worse, not whether the number is impressive.
      - name: Scorecard regression gate
        run: uv run bishop eval --gate

      - name: Coverage matrix is current
        run: |
          uv run bishop coverage
          git diff --exit-code docs/COVERAGE.md

  # The image, not just the code. `/scorecard` returned 404 in production for as
  # long as the API had been deployed, because the Dockerfile never copied the
  # file the endpoint reads — a defect that cannot exist in a checkout, so no
  # test running from one could see it. This job runs the container the way the
  # platform does and asks it the questions the console asks.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t bishop-api:ci .

      - name: Start
        run: |
          docker run -d --name bishop-ci -p 8000:8000 -e BISHOP_ENVIRONMENT=development bishop-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/live >/dev/null && exit 0
            sleep 1
          done
          docker logs bishop-ci
          exit 1

      - name: The endpoints the console calls answer
        run: |
          set -e
          for path in /health/ready /detectors /coverage /alerts /scorecard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { docker logs bishop-ci; exit 1; }
          done

      - name: Stop
        if: always()
        run: docker rm -f bishop-ci || true

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
